<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{ 
            font-family: 'Courier New', Courier, monospace;
            font-size: 42px;
        }
        .rojo{
            color:red;
        }
        .negrita{font-weight: bold;}
        .centrado{
            text-align: center;
        }
        #primero{
           text-decoration: underline; 
        }
        a,p{
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: overline;
            font-size: 22px;
        }
        article p{
            text-decoration: none;
            background-color: green;
            color: yellow;
        }
    </style>
    <title>Selectores</title>
</head>
<body>
    <h1 class="rojo">Hola Mundo</h1>  
    <h1 class="centrado">Segundo titular</h1>
    <header>
        <p class="negrita rojo centrado">Este texto es un ejemplo</p>
    </header> 
    <h2 id="primero">Este es un H2</h2>
    <a href="">Este es un enlace</a>
    <article>
        <p>
            Nuevo texto para ejemplo. <a href="">nuevo enlace</a>
        </p>
    </article>
</body>
</html>
