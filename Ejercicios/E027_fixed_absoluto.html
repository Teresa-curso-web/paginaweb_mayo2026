<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de fixed y absolute</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        body{
            height: 200vh;   /*para poder hacer scroll*/
            background-color: #f4f4f4;
        }
        h1{
            padding-top: 2.5rem;
            padding-left: 2rem;
        }
        .subtitulo{
            padding-top: 2.5rem;
            padding-left: 2rem;
        }
        .contenedor{
            position: fixed;
            bottom: 20px;
            right: 20px;

            width: 20vw;
            height: 65vh;

            background-color: white;
            border-radius: 16px;
            box-shadow:  0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .soporte{
            height: 3rem;
            background-color: #4f46e5;
            color: white;
            border-radius: 16px 16px 0 0;
            padding: 0.7rem;
        }
        .numero{
            position: absolute;
            top: 10px;
            right: 10px;
            width: 1rem;
            height: 1rem; 
            font-size: 0.5rem;
            font-weight: bold;
          
            color: white;
            background-color: red;
            border-radius: 2rem;

            display: flex;
            align-items: center;       /*Estas tres lineas sirven para justificar el contenido*/
            justify-content: center;
        }

        .chat{
            position: relative;
            top: 2rem;
            left: 0.5rem;
        }
        .mensaje{
            font-weight: 20rem;
            color: black;
            background-color: #eef2ff;
            border-radius: 10px;
            margin-bottom: 6px;
            padding: 10px 14px;
            width: fit-content;
            max-width: 80%;
        }
        .boton{
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 2.3rem;
            height: 2.3rem;
            padding: 0.5rem;
            border-radius: 6rem;          
            
            background-color: #10b981;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    
            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

    </style>
</head>
<body>
    <h1>Ejemplo de fixed + absolute</h1>
    <p class="subtitulo">Haz scroll y observa cómo el widget permanece fijo.</p>
    <div class="contenedor" >
        <div class="soporte">
            Chat soporte
            <div class="numero">3</div>
        <div class="chat">
            <p class="mensaje">Hola 👋</p>
            <p class="mensaje">¿Necesitas ayuda?</p>
            <p class="mensaje">Este panel está fixed</p>
            <p class="mensaje">Y los elementos internos usan absolute</p>
        </div>
        <button class="boton">+</button>
        </div>
    </div>
</body>
</html>
