<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- pagina original https://themewagon.github.io/RoadTrip/ -->
    <title>Road Street</title>
    <style>
         @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    *{
        margin: 0;
        padding: 0;
    }
    html{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        scroll-behavior: smooth;
    }
    .lobster-regular {
        font-family: "Lobster", sans-serif;
        font-weight: 400;
        font-size: 8rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.705);
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    .portada{
        width: 100%;
        height: 100vh;
        background-image: url("Img/road\ street.jpg");
        background-position: center;
        background-size: cover;
        overflow: hidden;
        position: relative;
    }
    .fondo{
        width: 100%;
        height: 100%;
        background-color: rgba(32, 32, 32, 0.507);
    }
    .fijo{
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 100;
        color: white;
        font-size: 1.3rem;
    }
    .negrita{
        font-weight: bold;
    }
    .flecha{
        position: absolute;
        bottom: 2.3rem;
        left: 50%;

        color: white;
        font-size: 1.5rem;
        border-radius: 2rem;
        padding: 0.5rem;
        background-color: rgba(245, 245, 245, 0.171);
    }
    .flecha a{
        color: white;
    }
    .flecha:hover{
        background-color: rgba(255, 255, 255, 0);
    }
    .flecha:hover i{
        color: rgba(255, 255, 255, 0.407);
    }
    
    section {
        width: 100%;
        height: 100vh;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        overflow: hidden;
        background-attachment: fixed;
    }
    

    </style>
</head>
<body>
    <header class="fijo">
        <p><span class="negrita">Road Trip</span> by Template</p>
    </header>
    <section class="portada">
        <div class="fondo">
            <h1 class="lobster-regular">This is Road Trip</h1>
            <p class="flecha">
                <a href=""><i class="fa-solid fa-angle-down"></i></a>
            </p>
        </div>
    </section>
    
</body>
</html>
