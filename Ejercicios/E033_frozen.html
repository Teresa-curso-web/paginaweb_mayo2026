<!DOCTYPE html>
<html lang="en">
    <!-- original https://www.frozensoliddesigns.com/ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />    
    <title>Frozen</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html{
            font-family: Raleway, sans-serif;
        }
        header{
            padding: 1.5rem;
            background-color: rgba(0, 0, 0, 0.904);
            color: white;
            font-size: 1.8vw;
            
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: fixed;
            top: 0;
        }
        header a{
            text-decoration: none;
            color: white;
        }
        section{
            height: 100vh;
            border-bottom: 8px solid black;   
            padding-top: 15rem;
            padding-left: 6rem;
            padding-right: 7.5rem;
        }
        .primero{
            background-image: url("Img/fondo_1.webp");

        }
        .subrayado{
            text-decoration: underline;
            text-decoration-thickness: 1.1vh;
            text-decoration-style: solid;
        }
        .subr-azul{
            text-decoration-color: #41d1eb;
        }
        .subr-verde{
            text-decoration-color: rgba(10, 185, 10, .6);
        }
        .subr-morado{
            text-decoration-color: #be418c;
        }
        h2{
            font-size: 9rem;
        }
        .primero i{
            color: rgb(114, 215, 240);
        }
        h3{
            font-size: 4.5rem;
            margin-top: 5rem;
        }
        h4{
            font-size: 2.5rem;
            margin-top: 5rem;
        }
        .segundo{
            background-color: rgb(75, 170, 207);
        }
        .segundo i{
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <p>frozen solid designs.</p>
        <p><a href=""><i class="fa-brands fa-youtube"></i></a></p>
        <p><a href=""><i class="fa-solid fa-envelope"></i></a> <a href="">jason@frozensoliddesigns.com</a></p>
    </header>
    <main>
        <section class="primero">
            <h2><i class="fa-solid fa-feather fa-flip-horizontal"></i>Affordable</h2>
            <h3>We provide solutions for <span class="subrayado subr-morado">every budget</span>.</h3>
            <h4>From <span class="subrayado subr-azul">simple</span> static sites to <span class="subrayado subr-verde">complex</span> custom web software - we will work with you to build what you're looking for.</h4>
        </section>
        <section class="segundo">
            <h2><i class="fa-solid fa-wifi"></i> Websites</h2>
            <p>Get up and running quickly without breaking the bank</p>
        </section>
        <section>
            
        </section>
    </main>
    
</body>
</html>
