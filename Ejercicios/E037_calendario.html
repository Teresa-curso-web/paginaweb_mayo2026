<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family:Georgia, 'Times New Roman', Times, serif;
        }
        body{
            background-color: #f3e7d3;
        }
        .contenedor {
            width: 900px;
            border: 6px double #5a4633;
            margin: 0 auto;
            padding: 1.5rem;
            background-color: #f8f1e3;
        }

        header {
            text-align: center;
            padding: 2rem;
            border-bottom: 2px solid #5a4633;
            margin-bottom: 2rem;
        }

        header p {
            font-style: italic;
        }

        h1 {
            font-size: 3rem;
        }

        .semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            border-bottom: 1px solid black;
            padding-bottom: 1rem;
            font-size: 1.3rem;
        }

        .cuadricula {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 100px;
            padding-bottom: 1.5rem;
            padding-top: 1rem;
            gap: 6px;
        }

        .dia {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
            font-size: 1.7rem;
            font-weight: bold;
        }
        .dia:hover{
            background-color: rgb(204, 241, 230);
        }

        .domingo {
            background-color: rgba(211, 174, 199, 0.767);
        }

        footer {
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid black;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <header>
            <h1>Octubre 1897</h1>
            <p>Registro de observaciones del viajero</p>
        </header>
        <div class="semana">
            <div>Lun</div>
            <div>Mar</div>
            <div>Mié</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sáb</div>
            <div>Dom</div>
        </div>
        <div class="cuadricula">
            <div></div>
            <div class="dia">1</div>
            <div class="dia">2</div>
            <div class="dia">3</div>
            <div class="dia">4</div>
            <div class="dia">5</div>
            <div class="dia domingo">6</div>
            <div class="dia">7</div>
            <div class="dia">8</div>
            <div class="dia">9</div>
            <div class="dia">10</div>
            <div class="dia">11</div>
            <div class="dia">12</div>
            <div class="dia domingo">13</div>
            <div class="dia">14</div>
            <div class="dia">15</div>
            <div class="dia">16</div>
            <div class="dia">17</div>
            <div class="dia">18</div>
            <div class="dia">19</div>
            <div class="dia domingo">20</div>
            <div class="dia">21</div>
            <div class="dia">22</div>
            <div class="dia">23</div>
            <div class="dia">24</div>
            <div class="dia">25</div>
            <div class="dia">26</div>
            <div class="dia domingo">27</div>
            <div class="dia">28</div>
            <div class="dia">29</div>
            <div class="dia">30</div>
            <div class="dia">31</div>
        </div>
        <footer>
            <p>"El tiempo se escribe a mano en los márgenes del mundo."</p>
        </footer>
    </div>
</body>

</html>
