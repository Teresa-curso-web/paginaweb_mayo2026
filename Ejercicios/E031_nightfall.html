<!DOCTYPE html>
<html lang="en">
    <!-- Original https://hugo-theme-nightfall.netlify.app/ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightfall</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap');
        *{
            margin: 0;
            padding: 0;
            font-family: "Fira Mono", monospace;
        }
        .contenedor{
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            display: flex;
            justify-content: space-around;
            padding: 1.4rem;
        }
        nav li, main li{
            display: inline-block;
            margin-right: 0.5rem;
        }
        nav a, main a{
            text-decoration: none;
            color: black;
        }
        .negro{
            background-color: black;
            color: white;
        }
        main{
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        main a:hover{
            text-decoration: underline;
        }
        h1{
            font-size: 3.2rem;
            margin-bottom: 2rem;
        }
        footer{
            text-align: center;
            background-color: black;
            color: white;
            padding: 1.3rem;
        }
        
    </style>
</head>
<body>
    <div class="contenedor">
        <header class="negro">
            <div class="logo">
            hello@gohugo.io ~ $
            </div>
            <nav>
                <ul>
                    <li><a  class="negro">~/about</a></li>
                    <li><a class="negro">~/blog</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Hugo Nightfall</h1>
            <ul>
                <li><a href="">github</a></li>
                <li><a href="">twitter</a></li>
                <li><a href="">linkedin</a></li>
                <li><a href="">email</a></li>
            </ul>
        </main>
        <footer>© 2026 Hugo Nightfall, Built with Hugo and Nightfall theme</footer>
    </div>
</body>
</html>
