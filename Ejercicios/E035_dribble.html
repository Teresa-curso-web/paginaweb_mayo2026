<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo ejemplo grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .contenedor{
            display: grid;
            grid-template-columns: 30% 35% 35%;
            grid-template-rows: 30% 30% 15% 25% ;
            gap: 20px ;
            width: 80%;
            min-height: 900px;
            margin: 0 auto;
            background-color: black;
            padding: 1rem;
            
        }
        .contenedor div{
            background-size: cover;
            background-position: center;
            overflow: hidden;
            border: 1px solid blue;
          
        }
        .uno{
            grid-column: 1 / span 2;
            background-image: url("Img/dribble_1.png");
        }
        .dos{
            background-image: url("dribble_2.png");
        }
        .tres{
            grid-row: 2/ span 2;
            background-image: url("dribble_3.png");
        }
        .cuatro{
            background-image: url("dribble_4.png");
        }
        .cinco{
            /* grid-row: 2/5; */
            background-image: url("dribble_5.png");
        }
        .seis{
            grid-row: 4/5;
            background-image: url("dribble_6.png");
        }
        .siete{
            grid-row: 3/5;
            background-image: url("dribble_7.png");
        }
    </style>
</head>
<body>
   <div class="contenedor">
    <div class="uno"></div>
    <div class="dos"></div>
    <div class="tres"></div>
    <div class="cuatro"></div>
    <div class="cinco"></div>
    <div class="seis"></div>
    <div class="siete"></div>
   </div> 
</body>
</html>
